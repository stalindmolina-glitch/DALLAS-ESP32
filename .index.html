<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Dual Dallas ESP32</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            background-color: #d32f2f;
            margin-bottom: 1.2rem;
        }
        .status-badge.connected { 
            background-color: #388e3c; 
        }
        .temp-label {
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .temp-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 5px 0 15px 0;
            color: #4fc3f7;
        }
        .sub-sensors {
            display: flex;
            justify-content: space-around;
            background-color: #252525;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .sub-sensors span {
            font-weight: bold;
            color: #81d4fa;
        }
        .rele-status-box {
            margin: 15px 0;
            font-size: 1rem;
        }
        .rele-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #444;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            box-shadow: 0 0 5px #000;
            transition: all 0.3s ease;
        }
        .rele-indicator.on {
            background-color: #00e676;
            box-shadow: 0 0 15px #00e676;
        }
        .section {
            background-color: #2c2c2c;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .section-title {
            font-size: 0.95rem;
            color: #ddd;
            display: block;
            margin-bottom: 10px;
        }
        .mode-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            background-color: #444;
            color: white;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button.active { 
            background-color: #0288d1; 
        }
        button.btn-action { 
            background-color: #00897b; 
            width: 100%; 
            margin-top: 12px; 
        }
        button.btn-action:hover { 
            background-color: #00695c; 
        }
        .inputs-group {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .input-box {
            flex: 1;
            text-align: left;
        }
        .input-box small {
            display: block;
            color: #bbb;
            margin-bottom: 4px;
            text-align: center;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #1e1e1e;
            color: white;
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;
        }
        .hidden { 
            display: none; 
        }
    </style>
</head>
<body>

<div class="card">
    <div id="connStatus" class="status-badge">Desconectado</div>
    
    <div class="temp-label">Temperatura Promedio</div>
    <div class="temp-display"><span id="tempProm">--</span> °C</div>

    <div class="sub-sensors">
        <div>Sensor 1: <span id="temp1">--</span> °C</div>
        <div>Sensor 2: <span id="temp2">--</span> °C</div>
    </div>

    <div class="rele-status-box">
        Estado del Relé: <strong id="releTexto" style="color: #aaa;">APAGADO</strong> 
        <span id="releIndicator" class="rele-indicator"></span>
    </div>

    <!-- Selector de Modo -->
    <div class="section">
        <span class="section-title">Modo de Operación</span>
        <div class="mode-buttons">
            <button id="btnAuto" class="active" onclick="cambiarModo('auto')">Automático</button>
            <button id="btnManual" onclick="cambiarModo('manual')">Manual</button>
        </div>
    </div>

    <!-- Panel Automático -->
    <div id="panelAuto" class="section">
        <span class="section-title">Rango de Activación (Promedio °C)</span>
        <div class="inputs-group">
            <div class="input-box">
                <small>Mínima (°C)</small>
                <input type="number" id="tempMin" value="20" step="0.5">
            </div>
            <div class="input-box">
                <small>Máxima (°C)</small>
                <input type="number" id="tempMax" value="28" step="0.5">
            </div>
        </div>
        <button class="btn-action" onclick="enviarRango()">Guardar Rango</button>
    </div>

    <!-- Panel Manual -->
    <div id="panelManual" class="section hidden">
        <span class="section-title">Control Manual del Relé</span>
        <div class="mode-buttons">
            <button style="background-color: #2e7d32;" onclick="controlManual(true)">ENCENDER</button>
            <button style="background-color: #c62828;" onclick="controlManual(false)">APAGAR</button>
        </div>
    </div>
</div>

<script>
    const topicDatos = "stalindmolina/dallas_esp32/datos";
    const topicControl = "stalindmolina/dallas_esp32/control";

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
        const badge = document.getElementById('connStatus');
        badge.innerText = "Conectado al Broker";
        badge.classList.add('connected');
        client.subscribe(topicDatos);
    });

    client.on('offline', () => {
        const badge = document.getElementById('connStatus');
        badge.innerText = "Desconectado";
        badge.classList.remove('connected');
    });

    client.on('message', (topic, message) => {
        if (topic === topicDatos) {
            const data = JSON.parse(message.toString());
            
            document.getElementById('tempProm').innerText = data.prom.toFixed(1);
            document.getElementById('temp1').innerText = data.t1 !== null ? data.t1.toFixed(1) : "Error";
            document.getElementById('temp2').innerText = data.t2 !== null ? data.t2.toFixed(1) : "Error";
            
            const releEl = document.getElementById('releIndicator');
            const releTxt = document.getElementById('releTexto');
            
            if (data.rele === 1) {
                releEl.classList.add('on');
                releTxt.innerText = "ENCENDIDO";
                releTxt.style.color = "#00e676";
            } else {
                releEl.classList.remove('on');
                releTxt.innerText = "APAGADO";
                releTxt.style.color = "#aaa";
            }
        }
    });

    function cambiarModo(modo) {
        if (modo === 'auto') {
            document.getElementById('btnAuto').classList.add('active');
            document.getElementById('btnManual').classList.remove('active');
            document.getElementById('panelAuto').classList.remove('hidden');
            document.getElementById('panelManual').classList.add('hidden');
        } else {
            document.getElementById('btnManual').classList.add('active');
            document.getElementById('btnAuto').classList.remove('active');
            document.getElementById('panelManual').classList.remove('hidden');
            document.getElementById('panelAuto').classList.add('hidden');
        }
        client.publish(topicControl, JSON.stringify({ modo: modo }));
    }

    function enviarRango() {
        const min = parseFloat(document.getElementById('tempMin').value);
        const max = parseFloat(document.getElementById('tempMax').value);
        client.publish(topicControl, JSON.stringify({ modo: 'auto', min: min, max: max }));
        alert("Nuevo rango (" + min + "°C a " + max + "°C) enviado al ESP32");
    }

    function controlManual(encender) {
        client.publish(topicControl, JSON.stringify({ modo: 'manual', releManual: encender }));
    }
</script>

</body>
</html>
